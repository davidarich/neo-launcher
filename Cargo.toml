[package]
name = "neo-launcher"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["default", "__screenshot"] }
egui_extras = { version = "0.37.0", features = ["all_loaders", "default", "image"]}
env_logger = { version = "0.11.11", features = ["auto-color", "humantime"] }
image = { version = "0.25.10", features = ["jpeg", "png"] }
log = "0.4.34"
saphyr = "0.2.2"
serde = { version="1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time"] }
winapi = "0.3.9"

[[bin]]
name = "neo-launcher"
path = "src/main.rs"
